name: NautilusTrader RC8 regression

on:
  push:
    branches:
      - chore/nautilus-rc8-stage1
    paths:
      - ".github/workflows/nautilus-rc8-regression.yml"
      - "uv.lock"
      - "pyproject.toml"
      - "engine/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check NautilusTrader version
        run: uv run python -c 'import nautilus_trader; assert nautilus_trader.__version__ == "2.0.0rc8"'
      - name: Install shell dependency for tests
        run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - name: Build Rust converter
        run: cargo build --locked --release --manifest-path engine/pipeline/rust_converter/Cargo.toml
      - name: Ruff regression
        run: uv run ruff check .
      - name: Full Python regression
        run: uv run pytest -q
