name: Platform + external Engine compatibility

# Same immutable independent Engine revision as scripts/build_external_engine.sh.
# Upgrade this pin only with explicit cross-repo contract and regression review.
env:
  ENGINE_SOURCE_SHA: b33769d432c17fff2b743c31c7efdd6bf3cb450d

on:
  pull_request:
    paths:
      - "api/**"
      - "core/**"
      - "tests/legacy_engine_integration/market_data_test.py"
      - "tests/legacy_engine_integration/market_data_configuration_test.py"
      - "tests/legacy_engine_integration/market_data_engine_ownership_test.py"
      - "tests/legacy_engine_integration/conftest.py"
      - "tests/api/market_data_remote_test.py"
      - "docker/**"
      - ".dockerignore"
      - "tests/api/engine_isolation_test.py"
      - "tests/api/tenant_docker_test.py"
      - "tests/api/orm_storage_test.py"
      - "platform/**"
      - "tests/legacy_engine_integration/**"
      - "tests/api/auth_test.py"
      - "tests/api/management_test.py"
      - "tests/web/storage_test.py"
      - "migrations/**"
      - "tests/core/engine_contracts_test.py"
      - ".github/workflows/tenant-engine.yml"
  workflow_dispatch:
  schedule:
    # Weekly full regression: Monday 02:17 Asia/Seoul (Sunday 17:17 UTC).
    - cron: '17 17 * * 0'

# Cancel obsolete runs when a new commit is pushed to the same PR.
# Keep manually dispatched runs independent from each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      docker: ${{ steps.changes.outputs.docker }}
      frontend: ${{ steps.changes.outputs.frontend }}
      python: ${{ steps.changes.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine affected checks
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            printf 'full=true\ndocker=true\nfrontend=true\npython=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/ci-changed-files"
          test -s "$RUNNER_TEMP/ci-changed-files"
          full=false
          docker=false
          frontend=false
          python=false
          while IFS= read -r path; do
            case "$path" in
              api/*|core/*|platform/*|tests/*|migrations/*|packages/*|nautilus_support.py|pyproject.toml|uv.lock)
                python=true ;;
            esac
            case "$path" in
              api/*|web/*|core/*|tests/web/*|.github/workflows/tenant-engine.yml)
                frontend=true ;;
            esac
            case "$path" in
              core/*|docker/*|.dockerignore|api/engine_client.py|api/tenant_docker.py|.github/workflows/tenant-engine.yml)
                docker=true ;;
            esac
            case "$path" in
              core/*|docker/*|.dockerignore|migrations/*|packages/*|tests/*|nautilus_support.py|pyproject.toml|uv.lock|.github/workflows/tenant-engine.yml)
                full=true ;;
              api/exchanges/*|api/operations/*|api/strategies/*|api/equity/*|api/market_data/*|api/db/*|api/auth/*|api/tenants/*|api/engine_client.py|api/tenant_docker.py|api/config.py|api/main.py)
                full=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changed-files"
          printf 'full=%s\ndocker=%s\nfrontend=%s\npython=%s\n' \
            "$full" "$docker" "$frontend" "$python" >> "$GITHUB_OUTPUT"

  fast_checks:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Checkout pinned standalone Engine for shared transport smoke
        uses: actions/checkout@v4
        with:
          repository: saoxia/seealpha-engine
          ref: ${{ env.ENGINE_SOURCE_SHA }}
          path: _external_engine
      - name: Refuse Engine/Platform contract drift
        run: |
          cmp core/engine_contracts.py _external_engine/core/engine_contracts.py
          cmp core/trading_contracts.py _external_engine/core/trading_contracts.py
      - name: Full Python lint
        run: uv run ruff check .
      - name: Contract and isolation smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}/_external_engine:${{ github.workspace }}
        run: uv run pytest -q tests/core/engine_contracts_test.py tests/api/engine_isolation_test.py

  api_regression:
    needs: scope
    if: ${{ needs.scope.outputs.python == 'true' && needs.scope.outputs.full != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Checkout pinned independent Engine for legacy API compatibility
        uses: actions/checkout@v4
        with:
          repository: saoxia/seealpha-engine
          ref: ${{ env.ENGINE_SOURCE_SHA }}
          path: _external_engine
      - name: API and Web backend regression
        env:
          PYTHONPATH: ${{ github.workspace }}/_external_engine:${{ github.workspace }}
        run: uv run pytest -q tests/api tests/legacy_engine_integration tests/web

  platform_regression:
    needs: scope
    if: ${{ needs.scope.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --project platform --locked
      - name: Standalone Platform regressions (without Engine/Nautilus)
        run: platform/.venv/bin/python -m pytest -c platform/pyproject.toml -q platform/tests

  frontend:
    needs: scope
    if: ${{ needs.scope.outputs.frontend == 'true' && needs.scope.outputs.full != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend unit tests
        working-directory: web
        run: npm run test:frontend
      - name: Frontend lint
        working-directory: web
        run: npm run lint
      - name: Frontend production build
        working-directory: web
        run: npm run build

  docker:
    needs: scope
    if: ${{ needs.scope.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned standalone Engine source
        uses: actions/checkout@v4
        with:
          repository: saoxia/seealpha-engine
          ref: ${{ env.ENGINE_SOURCE_SHA }}
          path: _external_engine
      - name: Refuse Engine/Platform v2 contract drift
        run: |
          cmp core/engine_contracts.py _external_engine/core/engine_contracts.py
          cmp core/trading_contracts.py _external_engine/core/trading_contracts.py
      - name: Build independently owned Engine image
        run: docker build -f _external_engine/docker/engine.Dockerfile -t seealpha-engine:ci _external_engine
      - name: Engine image excludes Platform source
        run: docker run --rm --entrypoint sh seealpha-engine:ci -c 'test ! -e /app/api && test ! -e /app/web && test ! -e /app/migrations'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Docker manager integration
        run: SEEALPHA_TEST_DOCKER=1 uv run pytest -q tests/api/tenant_docker_integration_test.py
      - name: Container tenant-bound HTTP smoke
        run: |
          mkdir -p /tmp/seealpha-ci/{state,data,run,logs}
          docker run -d --name seealpha-engine-ci -p 127.0.0.1:18766:8766 \
            -e ENGINE_HOST=0.0.0.0 -e ENGINE_PORT=8766 \
            -e ENGINE_TOKEN=ci-only-engine-token \
            -e ENGINE_TENANT_ID=42 -e ENGINE_TENANT_PURPOSE=development \
            -v /tmp/seealpha-ci/state:/app/.local/state/engine \
            -v /tmp/seealpha-ci/data:/app/data \
            -v /tmp/seealpha-ci/run:/app/.local/run \
            -v /tmp/seealpha-ci/logs:/app/logs \
            seealpha-engine:ci
          trap 'docker logs seealpha-engine-ci || true; docker rm -f seealpha-engine-ci || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS --max-time 2 -H 'Authorization: Bearer ci-only-engine-token' http://127.0.0.1:18766/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-engine-token' \
            http://127.0.0.1:18766/tenants/99/export)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-engine-token' \
            -H 'Content-Type: application/json' \
            -d '{"purpose":"development"}' \
            -X PUT http://127.0.0.1:18766/tenants/42)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"symbols":["ETHUSDT"]}' \
            -X POST http://127.0.0.1:18766/tenants/42/data/datasets)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-engine-token' \
            -H 'Content-Type: application/json' \
            -d '{"symbols":["ETHUSDT"]}' \
            -X POST http://127.0.0.1:18766/tenants/99/data/datasets)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-engine-token' \
            -H 'Content-Type: application/json' \
            -d '{"symbols":["ETHUSDT"]}' \
            -X POST http://127.0.0.1:18766/tenants/42/data/datasets)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-engine-token' \
            -H 'Content-Type: application/json' \
            -d '{"policies":[{"symbol":"ETHUSDT","realtime_enabled":false}]}' \
            -X POST http://127.0.0.1:18766/tenants/42/data/control/sync)" = 200
          curl -fsS -H 'Authorization: Bearer ci-only-engine-token' \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:18766/tenants/42/data/control/subscriptions | grep ETHUSDT
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:18766/tenants/42/jobs)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-engine-token' \
            http://127.0.0.1:18766/tenants/99/jobs)" = 403
          curl -fsS -H 'Authorization: Bearer ci-only-engine-token' \
            http://127.0.0.1:18766/tenants/42/jobs | grep items

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-only-engine-token' \
            -H 'Content-Type: application/json' \
            -d '{"policies":[]}' \
            -X POST http://127.0.0.1:18766/tenants/99/data/control/sync)" = 403
          docker restart seealpha-engine-ci
          for i in $(seq 1 50); do
            if curl -fsS --max-time 2 -H 'Authorization: Bearer ci-only-engine-token' http://127.0.0.1:18766/health; then break; fi
            sleep 1
          done
          curl -fsS -H 'Authorization: Bearer ci-only-engine-token' \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:18766/tenants/42/data/control/subscriptions | grep ETHUSDT

          isolated="$(mktemp -d)"
          cp -R api core "$isolated/"
          SEEALPHA_PLATFORM_ROOT="$isolated" uv run python -I - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["SEEALPHA_PLATFORM_ROOT"])
          sys.path.insert(0, str(root))
          from api.engine_client import EngineClient
          from core.engine_contracts import ENGINE_CONTRACT_VERSION, QueryError
          from fastapi import HTTPException

          engine = EngineClient(root, url="http://127.0.0.1:18766", token="ci-only-engine-token")
          health = engine._sync("GET", "/health")
          assert health["contract_version"] == ENGINE_CONTRACT_VERSION
          assert engine.ensure_tenant(42, "development")["tenant_id"] == "42"
          assert isinstance(engine.list_tasks(42), list)
          try:
              engine.list_tasks(99)
          except HTTPException as exc:
              assert exc.status_code == 403
          else:
              raise AssertionError("cross-tenant request was accepted")
          wrong = EngineClient(root, url="http://127.0.0.1:18766", token="invalid-token")
          try:
              wrong._sync("GET", "/health")
          except QueryError:
              pass
          else:
              raise AssertionError("unauthorized request was accepted")
          assert not {"engine", "nautilus_trader"} & set(sys.modules)
          assert Path(sys.modules["api"].__file__).is_relative_to(root)
          PY

  full_acceptance:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - name: Checkout pinned standalone Engine source
        uses: actions/checkout@v4
        with:
          repository: saoxia/seealpha-engine
          ref: ${{ env.ENGINE_SOURCE_SHA }}
          path: _external_engine
      - name: Refuse Engine/Platform v2 contract drift
        run: |
          cmp core/engine_contracts.py _external_engine/core/engine_contracts.py
          cmp core/trading_contracts.py _external_engine/core/trading_contracts.py
      - name: Build Rust converter from standalone Engine source
        run: cargo build --locked --release --manifest-path _external_engine/engine/pipeline/rust_converter/Cargo.toml
      - name: Rust converter unit tests (standalone)
        run: cargo test --locked --release --manifest-path _external_engine/engine/pipeline/rust_converter/Cargo.toml
      - name: Full Python compatibility regression (Engine imported only from separate checkout)
        env:
          PYTHONPATH: ${{ github.workspace }}/_external_engine:${{ github.workspace }}
        run: |
          python -c 'from pathlib import Path; assert not Path("engine").exists(); import engine; assert str(Path(engine.__file__).resolve()).startswith(str(Path("_external_engine").resolve()))'
          uv run pytest -q
      - name: Frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend unit tests
        working-directory: web
        run: npm run test:frontend
      - name: Frontend lint
        working-directory: web
        run: npm run lint
      - name: Frontend production build
        working-directory: web
        run: npm run build
