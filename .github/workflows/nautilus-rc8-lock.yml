name: NautilusTrader RC8 lock refresh

on:
  push:
    branches:
      - chore/nautilus-rc8-stage1
    paths:
      - ".github/workflows/nautilus-rc8-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nautilus-rc8-lock
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Resolve NautilusTrader RC8
        run: uv lock --upgrade-package nautilus-trader
      - name: Verify locked dependency installation
        run: uv sync --locked
      - name: Commit generated lockfile to upgrade branch
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: regenerate uv.lock for NautilusTrader RC8"
          git push origin HEAD:chore/nautilus-rc8-stage1
