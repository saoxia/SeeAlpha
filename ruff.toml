# Platform-owned code is linted here; an external, pinned Engine is only
# available in compatibility CI, not tracked inside this source tree.
cache-dir = ".local/cache/ruff"
line-length = 100
target-version = "py313"
extend-exclude = [
    ".local", ".venv", "_external_engine", "data", "logs", "reports",
]

[lint.isort]
known-first-party = ["api", "core", "engine", "nautilus_support", "tests"]
